<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title-tag">Factory IT Admin Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar-overlay" onclick="toggleMobileMenu()"></div>

    <section id="auth-view" class="view-section active ..."> 
        </section>

    <section id="app-view" class="view-section h-screen w-full overflow-hidden bg-slate-50">
        <aside id="sidebar" class="w-72 bg-[#020617] flex flex-col flex-shrink-0 shadow-2xl z-20 border-r border-slate-800">
            <div class="h-20 flex items-center px-8 border-b border-slate-800/80 text-white font-extrabold tracking-tight">
                <i class="fas fa-shield-halved text-rose-500 mr-3 text-xl"></i> 
                <span class="text-sm leading-tight">IT Admin Center</span>
            </div>
            <div class="p-6 my-2 mx-4 bg-slate-800/30 rounded-2xl border border-slate-700/50 backdrop-blur-md">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-rose-500 to-orange-500 flex items-center justify-center font-bold text-white shadow-lg shadow-rose-500/20" id="sidebar-avatar"><i class="fas fa-user-shield"></i></div>
                    <div class="overflow-hidden">
                        <div id="user-email" class="text-white font-bold truncate text-sm">Admin</div>
                        <div id="user-role" class="text-[9px] text-rose-400 font-black uppercase tracking-widest mt-0.5" data-i18n="role_admin">IT Admin</div>
                    </div>
                </div>
            </div>
            <nav class="flex-1 mt-2 space-y-1.5 overflow-y-auto">
                <p class="px-8 text-[10px] font-black uppercase tracking-widest text-slate-500 mb-3 mt-4" data-i18n="menu_group_1">Workspace</p>
                <a href="#" onclick="switchTab('dashboard')" class="flex items-center menu-link active"><i class="fas fa-border-all w-8 text-lg opacity-80"></i> <span data-i18n="menu_dash" class="font-medium text-sm">Dashboard</span></a>
                
                <p class="px-8 text-[10px] font-black uppercase tracking-widest text-slate-500 mt-8 mb-3" data-i18n="menu_group_2">Admin</p>
                <a href="#" onclick="switchTab('admin')" class="flex items-center menu-link text-indigo-400"><i class="fas fa-shield-halved w-8 text-lg opacity-80"></i> <span data-i18n="menu_admin" class="font-medium text-sm">Command Center</span></a>
            </nav>
            <div class="p-6">
                <button id="btn-logout" class="w-full flex items-center justify-center gap-3 text-rose-400 font-bold py-3.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 transition-colors text-sm border border-rose-500/20"><i class="fas fa-power-off"></i> <span data-i18n="btn_logout">Log Out</span></button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col min-w-0 relative">
            <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-10 pb-20">
                
                <div id="tab-dashboard" class="tab-content active max-w-7xl mx-auto">...</div>

                <div id="tab-admin" class="tab-content max-w-7xl mx-auto">
                    </div>

            </div>
        </main>
    </section>

    <div id="ticket-modal" class="...">...</div>

    <script type="module" src="admin.js"></script>
</body>
</html>
