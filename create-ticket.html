<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Ticket - Factory IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50">
    <aside id="sidebar">
        <div class="h-20 flex items-center px-8 border-b border-slate-800 text-white font-bold text-lg"><i class="fas fa-industry text-blue-500 mr-3"></i> Factory IT</div>
        <div class="p-6 mx-4 my-2 bg-slate-800/30 rounded-2xl border border-slate-700/50">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-500 flex items-center justify-center text-white"><i class="fas fa-user"></i></div>
                <div class="overflow-hidden">
                    <div id="user-email" class="text-white font-bold truncate text-xs">Loading...</div>
                    <div id="user-role" class="text-[9px] text-blue-400 font-black uppercase tracking-widest mt-0.5">User</div>
                </div>
            </div>
        </div>
        <nav class="flex-1 mt-2 space-y-1 overflow-y-auto">
            <p class="px-8 text-[10px] font-black uppercase tracking-widest text-slate-500 mb-3 mt-4">Workspace</p>
            <a href="dashboard.html" class="menu-link"><i class="fas fa-border-all w-8 text-lg"></i> Dashboard</a>
            <a href="my-tickets.html" class="menu-link"><i class="fas fa-layer-group w-8 text-lg"></i> My Tickets</a>
            <a href="create-ticket.html" class="menu-link active"><i class="fas fa-plus-circle w-8 text-lg"></i> Create Ticket</a>
            <p class="px-8 text-[10px] font-black uppercase tracking-widest text-slate-500 mt-6 mb-3">AI Engine</p>
            <button onclick="openAIModal()" class="w-full text-left menu-link text-indigo-400 border-none bg-transparent cursor-pointer"><i class="fas fa-robot w-8 text-lg"></i> Serviceman AI</button>
        </nav>
        <div class="p-6"><button id="logout-btn" class="w-full flex justify-center gap-3 text-rose-400 font-bold py-3 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-sm border border-rose-500/20 cursor-pointer"><i class="fas fa-power-off"></i> Log Out</button></div>
    </aside>

    <main>
        <header class="mb-8"><h1 class="text-3xl font-black text-slate-800">Create Support Ticket</h1></header>
        
        <div class="bg-white p-10 rounded-[2rem] border border-slate-200 shadow-sm max-w-4xl">
            <form id="create-form" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Category</label>
                        <select id="tk-cat" class="w-full p-4 rounded-xl border border-slate-200 bg-slate-50 outline-none">
                            <option value="Hardware">❖ Hardware / PC Issue</option>
                            <option value="Software">❖ Software / Application</option>
                            <option value="Network">❖ Network / Internet</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Priority</label>
                        <select id="tk-pri" class="w-full p-4 rounded-xl border border-slate-200 bg-slate-50 outline-none">
                            <option value="Low">● Low (Minor)</option>
                            <option value="Moderate" selected>● Moderate (Normal)</option>
                            <option value="High">● High (Urgent)</option>
                            <option value="Critical">● Critical (Emergency)</option>
                        </select>
                    </div>
                </div>

                <div class="p-5 bg-slate-50 rounded-2xl border border-slate-100 space-y-4">
                    <p class="text-xs font-bold text-slate-800 mb-3 border-b border-slate-200 pb-2"><i class="fas fa-map-marker-alt text-rose-500 mr-1"></i> Location Details</p>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Building</label>
                            <select id="tk-bldg" class="w-full p-2 border rounded bg-white">
                                <option value="Main Factory">Main Factory</option>
                                <option value="Office">Office</option>
                                <option value="Warehouse">Warehouse</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Floor</label>
                            <select id="tk-floor" class="w-full p-2 border rounded bg-white">
                                <option value="1">Floor 1</option><option value="2">Floor 2</option><option value="3">Floor 3</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Department</label>
                            <select id="tk-dept" class="w-full p-2 border rounded bg-white">
                                <option value="Production">Production</option><option value="IT">IT</option><option value="HR">HR</option><option value="QA/QC">QA/QC</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Line</label>
                            <select id="tk-line" class="w-full p-2 border rounded bg-white">
                                <option value="N/A">N/A</option><option value="Line 1">Line 1</option><option value="Line 2">Line 2</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Broken Part / Item</label>
                    <select id="tk-item" class="w-full p-4 rounded-xl border border-slate-200 bg-slate-50 outline-none" required>
                        <option value="" disabled selected>เลือกอุปกรณ์ที่มีปัญหา...</option>
                        <option value="PC / คอมพิวเตอร์">💻 PC / คอมพิวเตอร์</option>
                        <option value="Notebook / โน้ตบุ๊ก">💻 Notebook / โน้ตบุ๊ก</option>
                        <option value="Monitor / จอภาพ">🖥️ Monitor / จอภาพ</option>
                        <option value="Mouse & Keyboard">🖱️ Mouse & Keyboard</option>
                        <option value="Printer / เครื่องพิมพ์">🖨️ Printer / เครื่องพิมพ์</option>
                        <option value="Barcode Printer / สติ๊กเกอร์">🏷️ Barcode Printer</option>
                        <option value="Scanner / เครื่องยิงบาร์โค้ด">📠 Scanner</option>
                        <option value="Network / Wi-Fi">📡 Network / Wi-Fi</option>
                        <option value="Software / ERP">⚙️ Software / ERP</option>
                        <option value="Other">❓ อื่นๆ (ระบุในรายละเอียด)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Subject</label>
                    <input type="text" id="tk-sub" placeholder="สรุปปัญหาเบื้องต้น..." class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Description</label>
                    <textarea id="tk-desc" rows="4" placeholder="ระบุรายละเอียดเพิ่มเติม..." class="w-full p-4 rounded-xl border border-slate-200 outline-none resize-none focus:ring-2 focus:ring-blue-500" required></textarea>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Attach Image</label>
                    <input type="file" id="tk-img" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-700 transition transform hover:-translate-y-1">
                    <i class="fas fa-paper-plane mr-2"></i> Submit Request
                </button>
            </form>
        </div>
    </main>

    <div id="ai-modal" class="fixed inset-0 z-[300] hidden items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 transition-opacity duration-300 opacity-0">
        <div class="bg-white w-[450px] h-[600px] rounded-[2rem] flex flex-col overflow-hidden shadow-2xl relative" id="ai-box">
            <div class="p-6 bg-indigo-600 text-white flex justify-between items-center"><h3 class="font-black">Serviceman AI</h3><button onclick="closeAIModal()"><i class="fas fa-times"></i></button></div>
            <div class="flex-1 overflow-y-auto p-5 bg-slate-50" id="ai-chat-box"></div>
            <div class="p-4 bg-white border-t border-slate-100 flex gap-2">
                <input type="text" id="ai-input" placeholder="พิมพ์ถามบอท..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none">
                <button onclick="sendAIMessage()" class="bg-indigo-600 text-white w-12 rounded-xl flex items-center justify-center"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="bot.js"></script>
    <script type="module" src="global.js"></script>
    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        document.getElementById('create-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button'); btn.disabled = true; btn.innerText = 'Submitting...';
            
            try {
                let imgUrl = null;
                const imgFile = document.getElementById('tk-img').files[0];
                if(imgFile) imgUrl = await window.getBase64(imgFile);
                
                const docRef = await addDoc(collection(db, "incidents"), { 
                    callerEmail: auth.currentUser.email, 
                    category: document.getElementById('tk-cat').value, 
                    priority: document.getElementById('tk-pri').value, 
                    building: document.getElementById('tk-bldg').value, 
                    floor: document.getElementById('tk-floor').value, 
                    department: document.getElementById('tk-dept').value, 
                    line: document.getElementById('tk-line').value, 
                    brokenItem: document.getElementById('tk-item').value, 
                    subject: document.getElementById('tk-sub').value, 
                    description: document.getElementById('tk-desc').value, 
                    imageUrl: imgUrl,
                    status: 'New', 
                    createdAt: new Date() 
                });
                await addDoc(collection(db, "incidents", docRef.id, "comments"), { senderEmail: "system", text: "Ticket created successfully.", createdAt: new Date() });
                Swal.fire('Success', 'Ticket Created!', 'success').then(() => window.location.href = 'my-tickets.html');
            } catch (err) { 
                Swal.fire('Error', err.message, 'error'); 
                btn.disabled = false; btn.innerText = 'Submit Request'; 
            }
        };
    </script>
</body>
</html>
