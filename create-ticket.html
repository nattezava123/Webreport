<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Create Support Ticket - Factory IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css"></head><body class="bg-slate-50">
    <aside id="sidebar">
        <div class="h-20 flex items-center px-8 border-b border-slate-800 text-white font-bold text-lg"><i class="fas fa-industry text-blue-500 mr-3"></i> Factory IT</div>
        <div class="p-6 mx-4 my-2 bg-slate-800/30 rounded-2xl border border-slate-700/50">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-500 flex items-center justify-center text-white"><i class="fas fa-user"></i></div>
                <div class="overflow-hidden">
                    <div id="user-email" class="text-white font-bold truncate text-xs">Loading...</div>
                    <div id="user-role" class="text-[9px] text-blue-400 font-black uppercase tracking-widest mt-0.5">User</div>
                </div>
            </div>
        </div>
        <nav class="flex-1 mt-2 space-y-1 overflow-y-auto">
            <p class="px-8 text-[10px] font-black uppercase tracking-widest text-slate-500 mb-3 mt-4">Workspace</p>
            <a href="dashboard.html" class="menu-link "><i class="fas fa-border-all w-8 text-lg"></i> Dashboard</a>
            <a href="my-tickets.html" class="menu-link "><i class="fas fa-layer-group w-8 text-lg"></i> My Tickets</a>
            <a href="create-ticket.html" class="menu-link active"><i class="fas fa-plus-circle w-8 text-lg"></i> Create Ticket</a>
            
            <p class="px-8 text-[10px] font-black uppercase tracking-widest text-slate-500 mt-6 mb-3">AI Engine</p>
            <button onclick="openAIModal()" class="w-full text-left menu-link text-indigo-400 border-none bg-transparent cursor-pointer"><i class="fas fa-robot w-8 text-lg"></i> Serviceman AI</button>
            
            <div id="admin-menu" class="hidden">
                <p class="px-8 text-[10px] font-black uppercase tracking-widest text-slate-500 mt-6 mb-3">Admin</p>
                <a href="admin.html" class="menu-link  text-rose-400"><i class="fas fa-shield-halved w-8 text-lg"></i> Command Center</a>
            </div>
        </nav>
        <div class="p-6"><button id="logout-btn" class="w-full flex justify-center gap-3 text-rose-400 font-bold py-3 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-sm border border-rose-500/20 cursor-pointer"><i class="fas fa-power-off"></i> Log Out</button></div>
    </aside>
    <main><header class="mb-8"><h1 class="text-3xl font-black text-slate-800">Create Support Ticket</h1></header><div class="bg-white p-10 rounded-[2rem] border border-slate-200 shadow-sm max-w-4xl">
    <form id="create-form" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div><label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Category</label>
            <select id="tk-cat" class="w-full p-4 rounded-xl border border-slate-200 bg-slate-50 outline-none"><option value="Hardware">Hardware / PC Issue</option><option value="Software">Software / Application</option><option value="Network">Network / Internet</option></select></div>
            <div><label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Priority</label>
            <select id="tk-pri" class="w-full p-4 rounded-xl border border-slate-200 bg-slate-50 outline-none"><option value="Low">Low</option><option value="Moderate" selected>Moderate</option><option value="High">High</option><option value="Critical">Critical</option></select></div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div><label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Building</label><input type="text" id="tk-bldg" class="w-full p-2 border rounded bg-slate-50" placeholder="e.g. Main"></div>
            <div><label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Floor</label><input type="text" id="tk-floor" class="w-full p-2 border rounded bg-slate-50" placeholder="e.g. 1"></div>
            <div><label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Department</label><input type="text" id="tk-dept" class="w-full p-2 border rounded bg-slate-50" placeholder="e.g. IT"></div>
            <div><label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Line</label><input type="text" id="tk-line" class="w-full p-2 border rounded bg-slate-50" placeholder="e.g. Line 1"></div>
        </div>
        <div><label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Broken Part / Item</label>
        <select id="tk-item" class="w-full p-4 rounded-xl border border-slate-200 bg-slate-50 outline-none" required>
            <option value="" disabled selected>เลือกอุปกรณ์ที่มีปัญหา...</option>
            <option value="PC / คอมพิวเตอร์">💻 PC / คอมพิวเตอร์</option>
            <option value="Printer / เครื่องพิมพ์">🖨️ Printer / เครื่องพิมพ์</option>
            <option value="Network / อินเทอร์เน็ต">📡 Network / อินเทอร์เน็ต</option>
            <option value="Other / อื่นๆ">❓ Other / อื่นๆ</option>
        </select></div>
        <div><label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Subject</label><input type="text" id="tk-sub" class="w-full p-4 rounded-xl border border-slate-200 outline-none" required></div>
        <div><label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Description</label><textarea id="tk-desc" rows="4" class="w-full p-4 rounded-xl border border-slate-200 outline-none resize-none" required></textarea></div>
        <div><label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Attach Image</label><input type="file" id="tk-img" accept="image/*" class="w-full"></div>
        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-700">Submit Request</button>
    </form>
</div>
<script type="module">
    import { db, auth } from './firebase-config.js';
    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    document.getElementById('create-form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button'); btn.disabled = true; btn.innerText = 'Submitting...';
        try {
            let imgUrl = null;
            const imgFile = document.getElementById('tk-img').files[0];
            if(imgFile) imgUrl = await window.getBase64(imgFile);
            
            const docRef = await addDoc(collection(db, "incidents"), { 
                callerEmail: auth.currentUser.email, 
                category: document.getElementById('tk-cat').value, 
                priority: document.getElementById('tk-pri').value, 
                building: document.getElementById('tk-bldg').value, 
                floor: document.getElementById('tk-floor').value, 
                department: document.getElementById('tk-dept').value, 
                line: document.getElementById('tk-line').value, 
                brokenItem: document.getElementById('tk-item').value, 
                subject: document.getElementById('tk-sub').value, 
                description: document.getElementById('tk-desc').value, 
                imageUrl: imgUrl,
                status: 'New', 
                createdAt: new Date() 
            });
            await addDoc(collection(db, "incidents", docRef.id, "comments"), { senderEmail: "system", text: "Ticket created successfully.", createdAt: new Date() });
            Swal.fire('Success', 'Ticket Created!', 'success').then(() => window.location.href = 'my-tickets.html');
        } catch (err) { Swal.fire('Error', err.message, 'error'); btn.disabled = false; btn.innerText = 'Submit Request'; }
    };
</script></main>
    <div id="ai-modal" class="fixed inset-0 z-[300] hidden items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 transition-opacity duration-300 opacity-0">
        <div class="bg-white w-[450px] h-[600px] rounded-[2rem] flex flex-col overflow-hidden shadow-2xl relative" id="ai-box">
            <div class="p-6 bg-indigo-600 text-white flex justify-between items-center"><h3 class="font-black">Serviceman AI</h3><button onclick="closeAIModal()"><i class="fas fa-times"></i></button></div>
            <div class="flex-1 overflow-y-auto p-5 bg-slate-50" id="ai-chat-box"></div>
            <div class="p-4 bg-white border-t border-slate-100 flex gap-2">
                <input type="text" id="ai-input" placeholder="พิมพ์ถามบอท..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none" onkeypress="if(event.key === 'Enter') sendAIMessage()">
                <button onclick="sendAIMessage()" class="bg-indigo-600 text-white w-12 rounded-xl flex items-center justify-center"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
    <!-- Modal Ticket Details -->
    <div id="ticket-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-[200] flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-5xl h-[80vh] rounded-[2rem] flex flex-col overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300" id="modal-box">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-white">
                <div class="flex items-center gap-3">
                    <span id="modal-priority-badge" class="px-3 py-1 bg-slate-100 rounded-md text-[10px] font-black uppercase"></span>
                    <h3 class="font-black text-xl text-slate-800" id="modal-id">ID</h3>
                </div>
                <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 hover:bg-rose-100 hover:text-rose-600"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex-1 flex overflow-hidden bg-slate-50">
                <div class="w-[40%] p-8 bg-white overflow-y-auto border-r border-slate-100">
                    <h4 class="text-2xl font-black text-slate-800 mb-4" id="modal-subject">Subject</h4>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 mb-4">
                        <p class="text-[10px] font-black uppercase text-slate-400 mb-1" id="modal-location">Location</p>
                        <p class="text-sm font-bold text-rose-600" id="modal-item">Item</p>
                    </div>
                    <div class="mb-4">
                        <p class="text-[10px] font-black uppercase text-slate-400 mb-1">Description</p>
                        <p class="text-sm text-slate-600 whitespace-pre-wrap" id="modal-desc">Desc</p>
                    </div>
                    <div id="modal-image-container" class="hidden">
                        <p class="text-[10px] font-black uppercase text-slate-400 mb-1">Attached Image</p>
                        <img id="modal-image" src="" alt="Ticket Image" class="w-full rounded-xl border border-slate-200">
                    </div>
                </div>
                <div class="flex-1 flex flex-col bg-slate-50">
                    <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
                    <div class="p-4 bg-white border-t border-slate-200">
                        <form id="comment-form" class="flex gap-2">
                            <input type="file" id="comment-image" accept="image/*" class="hidden">
                            <label for="comment-image" class="w-12 h-12 flex items-center justify-center bg-slate-100 text-slate-500 rounded-xl cursor-pointer hover:bg-slate-200"><i class="fas fa-image"></i></label>
                            <input type="text" id="comment-text" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none" placeholder="Type a reply...">
                            <button type="submit" class="bg-blue-600 text-white w-12 rounded-xl flex items-center justify-center"><i class="fas fa-paper-plane"></i></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="bot.js"></script>
    <script type="module" src="global.js"></script>
    </body></html>
