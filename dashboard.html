<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Factory IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50">
    <aside id="sidebar" class="fixed left-0 top-0 h-full w-72 bg-[#020617] flex flex-col border-r border-slate-800">
        <div class="h-20 flex items-center px-8 border-b border-slate-800 text-white font-bold"><i class="fas fa-industry text-blue-500 mr-3"></i> Factory IT</div>
        <nav class="flex-1 mt-6">
            <a href="dashboard.html" class="menu-link active"><i class="fas fa-th-large w-8"></i> Dashboard</a>
            <a href="my-tickets.html" class="menu-link"><i class="fas fa-list w-8"></i> My Tickets</a>
            <a href="create-ticket.html" class="menu-link"><i class="fas fa-plus w-8"></i> Create Ticket</a>
            <div id="admin-menu" class="hidden">
                <a href="admin.html" class="menu-link text-rose-400"><i class="fas fa-user-shield w-8"></i> Admin</a>
            </div>
        </nav>
        <button id="logout-btn" class="m-6 p-3 rounded-xl bg-rose-500/10 text-rose-500 border border-rose-500/20 font-bold">Logout</button>
    </aside>

    <main class="ml-72 p-10">
        <h1 class="text-3xl font-black mb-8 text-slate-800">Dashboard Overview</h1>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="stat-card bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                <p class="text-slate-400 text-xs font-bold uppercase mb-2">Total Tickets</p>
                <p class="text-4xl font-black text-slate-800" id="stat-total">0</p>
            </div>
            </div>
    </main>

    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, query, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = 'index.html');

        onAuthStateChanged(auth, user => {
            if(!user) window.location.href = 'index.html';
            if(user.email === 'nattezava1996@gmail.com') document.getElementById('admin-menu').classList.remove('hidden');
        });

        onSnapshot(collection(db, "incidents"), (snap) => {
            document.getElementById('stat-total').innerText = snap.size;
        });
    </script>
</body>
</html>
