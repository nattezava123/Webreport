<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Login - Factory IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-animated-gradient min-h-screen flex items-center justify-center p-4">
    <div class="glass-panel p-10 rounded-[2rem] w-full max-w-[420px]">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 text-white shadow-xl"><i class="fas fa-industry text-3xl"></i></div>
            <h2 class="text-2xl font-bold text-slate-800" id="auth-title">Sign In</h2>
        </div>
        <form id="auth-form" class="space-y-4">
            <input type="email" id="email" placeholder="Email" class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500" required>
            <input type="password" id="password" placeholder="Password" class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500" required>
            <button type="submit" id="btn-sub" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-blue-600 transition shadow-lg">Login</button>
        </form>
        <div class="mt-6 text-center text-sm">
            <span id="sw-text">New here?</span> <button onclick="toggleMode()" class="text-blue-600 font-bold ml-1">Create account</button>
        </div>
    </div>
    <script type="module" src="global.js"></script>
    <script type="module">
        import { auth } from './firebase-config.js';
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        let isLogin = true;
        window.toggleMode = () => {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? "Sign In" : "Register";
            document.getElementById('btn-sub').innerText = isLogin ? "Login" : "Sign Up";
            document.getElementById('sw-text').innerText = isLogin ? "New here?" : "Already have an account?";
        };
        document.getElementById('auth-form').onsubmit = (e) => {
            e.preventDefault();
            const action = isLogin ? signInWithEmailAndPassword : createUserWithEmailAndPassword;
            action(auth, document.getElementById('email').value, document.getElementById('password').value).catch(err => Swal.fire('Error', err.message, 'error'));
        };
    </script>
</body>
</html>
