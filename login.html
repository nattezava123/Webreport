<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Login - Factory IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-animated-gradient min-h-screen flex items-center justify-center p-4">
    <div class="glass-panel p-10 rounded-[2rem] w-full max-w-[420px]">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 shadow-xl text-white"><i class="fas fa-industry text-3xl"></i></div>
            <h2 class="text-2xl font-bold text-slate-800" id="auth-title">Factory IT Service</h2>
        </div>
        <form id="auth-form" class="space-y-4">
            <input type="email" id="auth-email" placeholder="Email" class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500" required>
            <input type="password" id="auth-password" placeholder="Password" class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500" required>
            <button type="submit" id="auth-submit-btn" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-blue-600 transition shadow-lg">Sign In</button>
        </form>
        <div class="mt-8 text-center text-sm">
            <span class="text-slate-500 font-medium" id="auth-switch-text">New here?</span> 
            <button onclick="toggleAuthMode()" id="auth-switch-btn" class="text-blue-600 font-bold hover:text-blue-800 transition">Create an account</button>
        </div>
    </div>
    
    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        
        let isLoginMode = true;
        window.toggleAuthMode = () => {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-submit-btn').innerText = isLoginMode ? "Sign In" : "Register";
            document.getElementById('auth-switch-text').innerText = isLoginMode ? "New here?" : "Already have an account?";
            document.getElementById('auth-switch-btn').innerText = isLoginMode ? "Create an account" : "Sign in";
            document.getElementById('auth-title').innerText = isLoginMode ? "Factory IT Service" : "Create Account";
        };

        document.getElementById('auth-form').onsubmit = (e) => {
            e.preventDefault();
            const btn = document.getElementById('auth-submit-btn');
            btn.innerText = "Processing...";
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            const action = isLoginMode ? signInWithEmailAndPassword : createUserWithEmailAndPassword;
            
            action(auth, email, pass).then(() => {
                window.location.href = 'dashboard.html';
            }).catch(err => {
                Swal.fire('Error', err.message, 'error');
                btn.innerText = isLoginMode ? "Sign In" : "Register";
            });
        };
    </script>
    <script type="module" src="js/auth-check.js"></script>
</body>
</html>
